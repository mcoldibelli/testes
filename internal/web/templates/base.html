<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{template "titulo" .}} | Ordens de Serviço</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1d2330; }
  header { background: #1f3a5f; color: #fff; padding: 12px 24px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  header a, header button { color: #fff; text-decoration: none; background: none; border: 0; font: inherit; cursor: pointer; }
  header .usuario { margin-left: auto; }
  main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
  .cartao { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e3e6eb; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #b8c0cc; border-radius: 4px; font: inherit; }
  button.primario, a.botao { display: inline-block; margin-top: 16px; background: #1f6feb; color: #fff; border: 0; padding: 8px 16px; border-radius: 4px; cursor: pointer; text-decoration: none; }
  .mensagem { background: #e6f4ea; border: 1px solid #34a853; padding: 10px; border-radius: 4px; }
  .erro { background: #fdecea; border: 1px solid #d93025; padding: 10px; border-radius: 4px; }
  .erro-campo { display: block; color: #b3261e; font-size: .9em; }
  .atrasada { color: #b3261e; font-weight: 600; }
  .indicadores { display: flex; gap: 12px; flex-wrap: wrap; }
  .indicadores div { flex: 1; min-width: 120px; background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .indicadores strong { display: block; font-size: 1.8em; }
  .filtros { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
  .filtros > * { flex: 1; min-width: 140px; }
</style>
</head>
<body>
{{if .Usuario.ID}}
<header>
  <a id="menu-painel" href="/">Painel</a>
  <a id="menu-clientes" href="/clientes">Clientes</a>
  <a id="menu-ordens" href="/ordens">Ordens de serviço</a>
  <span class="usuario" id="usuario-logado">{{.Usuario.Nome}}</span>
  <form method="post" action="/logout"><button id="sair" type="submit">Sair</button></form>
</header>
{{end}}
<main>
{{template "conteudo" .}}
</main>
</body>
</html>
